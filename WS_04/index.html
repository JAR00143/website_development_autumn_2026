<!DOCTYPE html>
<html>
<head>
    <title>My First HTML Page</title>
    <style>
        body {
            background-color: lightgray;
        }

        h1 {
            color: green;
            font-size: 2em;
        }

        p {
            color: blue;
        }

        .content-box {
            padding: 20px;
            margin: 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        
        th {
            background-color: #f2f2f2;
        }
        
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        label {
            font-weight: bold;
        }
        
        input[type="text"], input[type="email"] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        input[type="submit"]:hover {
            background-color: #45a049;
        
        }

        /* LISÄÄ UUDET CSS-TYYLIT TÄHÄN: */
        .transition-button {
            background-color: lightblue;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .transition-button:hover {
            background-color: lightcoral;
        }
        .animation-box {
            width: 50px;
            height: 50px;
            background-color: lightgreen;
            position: relative;
            animation: move 2s infinite alternate;
        }
        
        @keyframes move {
            from {
                left: 0;
            }
            to {
                left: 100px;
            }
        }
        @keyframes move {
            from {
                left: 0;
            }
            to {
                left: 100px;
            }
        }

        .pseudo-list li:nth-child(odd) {
            background-color: lightgray;
        }
        
        .pseudo-list li:nth-child(even) {
            background-color: white;
        }
    .pseudo-list li:nth-child(even) {
            background-color: white;
        }

        .filter-image {
            filter: grayscale(100%);
            transition: filter 0.3s ease;
            width: 300px;
            height: auto;
        }
        
        .filter-image:hover {
            filter: grayscale(0%);
        }
        .filter-image:hover {
            filter: grayscale(0%);
        }

        .quote {
            position: relative;
            padding-left: 20px;
            font-style: italic;
        }
        
        .quote::before {
            content: '“';
            font-size: 40px;
            position: absolute;
            left: 0;
            top: 0;
            color: gray;
        }
    </style>
</head>
<body>

    <header>
        <h1 style="color: blue;">Welcome to Janne's Page</h1>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#courses">Courses</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>About Me</h2>
            <p>This is a paragraph.</p>
            <p><a href="https://www.laurea.fi">Visit Laurea</a>.</p>
            <img src="JanneRita.JPG" alt="omakuva" style="width: 300px; height: auto;">

            <h2 style="font-size: 20px;">My most hated things</h2>
            <ol>
                <li>Orientering</li>
                <li>Cross country skiing</li>
                <li>Taekwondo poomse</li>
            </ol>
            
            <h2>My hobbies</h2>
            <ul>
                <li>Taekwondo</li>
                <li>Stunts</li>
                <li>biking</li>
            </ul>
        </section>

        <section id="courses">
            <h2>Opinnot</h2>
            <table>
                <!-- Tähän sinun olemassa oleva <table>-taulukkosi -->
            </table>
        </section>

        <section id="contact">
            <h2>Ota yhteyttä</h2>
            <form>
                <!-- Tähän sinun olemassa oleva <form>-lomakkeesi -->
            </form>
        </section>

        <!-- Tässä alapuolella säilyvät myös WS03:n content-box, nappi, animaatio, lista, kuva ja lainaus -->
    </main>

    <footer>
        <p>Copyright 2026 - Janne Rita</p>
    </footer>

</body>
</html>
